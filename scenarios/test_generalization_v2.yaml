# Test scenario 2 v2 — generalization benchmark with completely different tenants, workflows, DIDs, policies, and seed.
# The controller reads ONLY from the HTTP API.
name: test_generalization_v2
seed: 8888
days: 8
history_days: 14
tick_minutes: 15
credits: 200
tenants:
- id: apex_finance
  workflows:
  - id: apex_collections
    use_case: overdue loan repayment reminder
    language_mix:
      hi: 0.5
      en: 0.3
      ta: 0.2
    dialling_window:
    - 9
    - 21
    dials_per_hour: 400
    daily_batch:
      size: 1500
      at_hour: 8
      returning_share: 0.4
    cadence:
    - 2
    - 3
    - 3
    base_pickup: 0.28
    base_engage: 0.52
    mid_flight: allowed
    options:
      welcome_message:
      - W1
      - W2
      - W3
      voice:
      - V1
      - V2
      - V3
      caller_id:
      - DID_91
      - DID_92
      - DID_93
      - DID_94
      prompt_version:
      - P1
      - P2
      - P3
      - P4
      - P5
    default_config:
      allocations:
        default:
          welcome_message:
            W1: 1
          voice:
            V1: 1
          caller_id:
            DID_91: 0.5
            DID_92: 0.5
      prompt_version: P1
    governance:
      approver_hours:
      - 10
      - 18
      approver_latency_minutes:
      - 30
      - 180
      proposal_ttl_hours: 18
      max_requests_per_24h: 3
      min_validation_pass_rate: 0.94
      auto_apply:
        allowed_dims:
        - schedule
        - caller_id
      canary_leads: 500
    objective:
      primary: engagement_rate
      guardrail: pickup_rate

- id: horizon_health
  workflows:
  - id: horizon_intake
    use_case: post-discharge health check-in
    language_mix:
      hi: 0.4
      en: 0.4
      ta: 0.2
    dialling_window:
    - 9
    - 20
    dials_per_hour: 300
    daily_batch:
      size: 1000
      at_hour: 8
      returning_share: 0.3
    cadence:
    - 2
    - 3
    base_pickup: 0.32
    base_engage: 0.60
    mid_flight: allowed
    options:
      welcome_message:
      - W1
      - W2
      voice:
      - V1
      - V2
      caller_id:
      - DID_81
      - DID_82
      - DID_83
      prompt_version:
      - P1
      - P2
      - P3
      - P4
    default_config:
      allocations:
        default:
          welcome_message:
            W1: 1
          voice:
            V1: 1
          caller_id:
            DID_81: 0.5
            DID_82: 0.5
      prompt_version: P1
    governance:
      approver_hours:
      - 10
      - 18
      approver_latency_minutes:
      - 30
      - 180
      proposal_ttl_hours: 18
      max_requests_per_24h: 3
      min_validation_pass_rate: 0.94
      auto_apply:
        allowed_dims:
        - schedule
        - caller_id
      canary_leads: 400
    objective:
      primary: conclusion_rate
      guardrail: pickup_rate

prompts:
  P1:
    summary: Current production prompt
    halluc: 0.006
    engage_mult: 1.0
  P3:
    summary: Grounded prompt
    halluc: 0.004
    engage_mult: 1.03
  P4:
    summary: Persuasive prompt
    halluc: 0.025
    engage_mult: 1.06
  P5:
    summary: Strict compliance prompt
    halluc: 0.003
    engage_mult: 0.88
  P2:
    summary: Supervisor edit with hallucination spike
    halluc: 0.065
    engage_mult: 0.92

did_l0_per_dph: 30
did_tau_days: 2
effects:
- workflow: apex_collections
  dim: voice
  value: V2
  mult: 1.15
- workflow: apex_collections
  dim: welcome_message
  value: W2
  mult: 1.10
- workflow: horizon_intake
  dim: voice
  value: V2
  mult: 1.12

incidents:
- type: did_flagged
  workflow: apex_collections
  did: DID_92
  at: D2 10:00
  base_health: 0.25
- type: supervisor_edit
  workflow: horizon_intake
  at: D3 11:30
  patch:
    prompt_version: P2
  note: supervisor tests new prompt P2 with 6.5% hallucination rate
- type: supervisor_edit
  workflow: apex_collections
  at: D4 14:00
  patch:
    allocations:
      default:
        voice:
          V2: 1
  note: supervisor manually adopts V2 on apex_collections
